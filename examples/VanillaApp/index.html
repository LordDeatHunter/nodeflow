<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nodeflow Vanilla Example</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: sans-serif;
        background: #1a1a2e;
        color: #eee;
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
      }
      h1 {
        flex: 0 0 auto;
        padding: 12px 16px;
        font-size: 1.2rem;
        background: #16213e;
        border-bottom: 1px solid #0f3460;
      }
      .toolbar {
        flex: 0 0 auto;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 8px 16px;
        background: #16213e;
        border-bottom: 1px solid #0f3460;
      }
      .toolbar button {
        min-height: 40px;
        padding: 8px 16px;
        background: #0f3460;
        color: #e2e2e2;
        border: 1px solid #1a1a4e;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
      }
      .toolbar button:hover {
        background: #1a1a4e;
      }
      .toolbar select {
        min-height: 40px;
        padding: 8px 12px;
        background: #0f3460;
        color: #e2e2e2;
        border: 1px solid #1a1a4e;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
      }
      .nodeflowBoundary {
        border-color: rgba(226, 226, 226, 0.5);
        background-color: rgba(255, 255, 255, 0.04);
      }
      .nodeflowGroupFrame {
        border: 1px dashed rgba(226, 226, 226, 0.35);
        background-color: rgba(255, 255, 255, 0.03);
      }
      .nodeflowGroupHeader,
      .nodeflowGroupCollapsed {
        color: #e2e2e2;
        font-size: 13px;
      }
      .nodeflowGroupHeader {
        background: rgba(15, 52, 96, 0.6);
        border-radius: 6px 6px 0 0;
      }
      .nodeflowGroupCollapsed {
        background: #16213e;
        border-color: #0f3460;
        min-height: 56px;
      }
      .nodeflowGroupToggle {
        width: 24px;
        height: 24px;
        background: #0f3460;
        color: #e2e2e2;
        border: 1px solid #1a1a4e;
        border-radius: 4px;
      }
      #app {
        flex: 1 1 0%;
        min-height: 0;
        position: relative;
        overflow: hidden;
      }
      .nodeflowNode {
        border: none !important;
      }
      @media (max-width: 480px) {
        h1 {
          font-size: 1rem;
          padding: 8px 12px;
        }
        .toolbar {
          padding: 6px 12px;
        }
        .toolbar button {
          flex: 1 1 auto;
        }
      }
    </style>
  </head>
  <body>
    <h1>Nodeflow — Vanilla TS Example</h1>
    <div class="toolbar">
      <button id="btn-add-node">Add Random Node</button>
      <button id="btn-add-connection">Add Random Connection</button>
      <button id="btn-group">Group Selected</button>
      <button id="btn-combine">Combine Selected</button>
      <button id="btn-break-apart">Break Apart Selected</button>
      <select id="boundary-mode" aria-label="Canvas boundary">
        <option value="off">Boundary: off</option>
        <option value="nodes">Boundary: nodes</option>
        <option value="view">Boundary: view</option>
        <option value="both">Boundary: nodes + view</option>
      </select>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
